name: Run Unit Tests

on: [push, pull_request]

jobs:
  test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        working-directory: bus_tracker
        run: flutter pub get

      - name: Run Tests
        working-directory: bus_tracker
        run: flutter test test/validation_service_test.dart