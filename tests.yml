name: Run Unit Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Java environment (required by some Android/Gradle steps in Flutter projects)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Set up Flutter SDK environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Install project dependencies
      - name: Install Dependencies
        working-directory: ./
        run: flutter pub get

      # Run the test suite (will fail the workflow if any test fails)
      - name: Run Tests
        working-directory: ./
        run: flutter test test/validation_service_test.dart
